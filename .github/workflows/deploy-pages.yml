name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Install dependencies
        run: npm ci || npm install

      - name: Build
        env:
          GH_EMAILJS_SERVICE_ID: ${{ secrets.VITE_EMAILJS_SERVICE_ID || secrets.EMAILJS_SERVICE_ID }}
          GH_EMAILJS_TEMPLATE_ID: ${{ secrets.VITE_EMAILJS_TEMPLATE_ID || secrets.EMAILJS_TEMPLATE_ID }}
          GH_EMAILJS_PUBLIC_KEY: ${{ secrets.VITE_EMAILJS_PUBLIC_KEY || secrets.EMAILJS_PUBLIC_KEY || secrets.VITE_EMAILJS_USER_ID || secrets.EMAILJS_USER_ID }}
        run: |
          if [ -n "$GH_EMAILJS_SERVICE_ID" ]; then export VITE_EMAILJS_SERVICE_ID="$GH_EMAILJS_SERVICE_ID"; fi
          if [ -n "$GH_EMAILJS_TEMPLATE_ID" ]; then export VITE_EMAILJS_TEMPLATE_ID="$GH_EMAILJS_TEMPLATE_ID"; fi
          if [ -n "$GH_EMAILJS_PUBLIC_KEY" ]; then export VITE_EMAILJS_PUBLIC_KEY="$GH_EMAILJS_PUBLIC_KEY"; fi
          npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
